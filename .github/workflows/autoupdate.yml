name: Update pull request branches

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      update_method:
        description: Branch update method
        required: true
        default: rebase
        type: choice
        options:
          - merge
          - rebase
      dry_run:
        description: Report updates without changing pull requests
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update pull request branches
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          UPDATE_METHOD: ${{ inputs.update_method || 'rebase' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          args=(--update-method "$UPDATE_METHOD")
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          bash scripts/update-prs.sh "${args[@]}"
